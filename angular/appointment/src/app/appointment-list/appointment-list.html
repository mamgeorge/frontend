
<div class="container">

  <div class = "card mt-3">
    <div class = "row">
      <div class = "col">
          <h2 class = "text-center">Create Appointment</h2>
      </div>
    </div>

    <div class = "row mt-3">
      <div class="col-md-6">
        <input class = "form-control" [(ngModel)] = "newApptTitle" placeholder="Appt Title"  /></div>
      <div class="col-md-6">
        <input class = "form-control" [(ngModel)] = "newApptDate" type ="date"
          placeholder="Appt Date" [value]="newApptDate | date:'yyyy-MM-dd'"></div>
      <div class="com-md-2">
          <button class = "btn btn-primary w-100" (click)="addAppointment()">Add Appointment</button></div>
    </div>

  </div>

  <div>
    <h2 class = "text-center mt-5">Appointment List</h2>
      <ul class = "list-group mt-3">
        <li class="list-group-item d-flex justify-content-between align-items-center"
          *ngFor="let appointment of appointments; index as ictr" >
            {{ appointment.id }}: {{ appointment.title }} - {{ appointment.date | date:'yyyy-MM-dd' }}
        <button class="btn btn-danger btn-sm"
            (click)="delAppointment(ictr)" >Delete</button>
        </li>
  </ul>
  </div>

</div>
